[tool.poetry]
name = "dsa-ai-coach-backend"
version = "0.1.0"
description = "Backend for AI-Native Software Engineering Learning Platform"
authors = ["Mageshwaran <mageshwaran@example.com>"]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.27.0" }
pydantic = "^2.6.0"
pydantic-settings = "^2.2.1"
starlette = ">=0.37.2"
python-json-logger = "^2.0.7"
loguru = "^0.7.2"
sqlalchemy = "^2.0.28"
alembic = "^1.13.1"
aiosqlite = "^0.20.0"
asyncpg = "^0.29.0"
passlib = "^1.7.4"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
openai = "^1.14.0"
prometheus-client = "^0.20.0"
redis = "^5.0.0"
websockets = "^12.0"
opentelemetry-api = "^1.23.0"
opentelemetry-sdk = "^1.23.0"
opentelemetry-exporter-otlp = "^1.23.0"
arq = "^0.28.0"
bcrypt = "^4.1.2"
email-validator = "^2.1.1"
python-multipart = "^0.0.9"

[tool.poetry.dev-dependencies]
ruff = "^0.2.2"
black = "^24.1.1"
mypy = "^1.9.0"
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "N", "D", "UP", "BLE", "B", "COM", "C4", "DJ", "DTZ", "EM", "EXE", "G", "ICN", "INP", "ISC", "PIE", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TCH", "TID", "TRY", "YTT"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "N818", "TCH", "TRY003", "INP001", "COM812", "B008", "BLE001", "TRY300", "TRY301", "PYI036", "SIM108", "RET504", "SIM105"]

[tool.black]
line-length = 120
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
