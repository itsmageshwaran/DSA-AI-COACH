version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dsa_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: dsa_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dsa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dsa_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: dsa_backend
    environment:
      - PORT=8000
      - DSA_DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/dsa_db
      - DSA_REDIS_URL=redis://redis:6379/0
      - DSA_ENVIRONMENT=development
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
